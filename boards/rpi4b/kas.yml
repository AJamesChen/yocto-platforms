header:
  version: 14

machine: raspberrypi4-64
distro: poky
target:
  - core-image-jamesc
  - rpi4-update-bundle

local_conf_header:
  rpi4b-hardware: |
    # Include the firmware needed by the board's Wi-Fi/Bluetooth chipset.
    LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

    ENABLE_UART = "1"
    ENABLE_I2C = "1"
    ENABLE_SPI_BUS = "1"

    # Legacy Raspberry Pi MMAL camera stack exposed through /dev/video0.
    # VIDEO_CAMERA selects the start4x.elf firmware on Raspberry Pi 4. Do not
    # load a sensor overlay as well: that belongs to the libcamera/Unicam path.
    VIDEO_CAMERA = "1"
    GPU_MEM = "128"
    KERNEL_MODULE_AUTOLOAD += "bcm2835-v4l2"

    # MFRC522 RFID reader on SPI0 CE0 with reset on GPIO25. The standalone
    # overlay is copied to the shared FAT boot partition for new WIC images.
    RPI_EXTRA_CONFIG = "camera_auto_detect=0\ndtoverlay=mfrc522\ndtoverlay=uln2003a"
    RPI_EXTRA_IMAGE_BOOT_FILES:append = " mfrc522.dtbo;overlays/mfrc522.dtbo uln2003a.dtbo;overlays/uln2003a.dtbo"
    EXTRA_IMAGEDEPENDS:append = " mfrc522-overlay uln2003a-overlay"

    # Motor IN-A..D on pins 32/35/38/40 share the keypad GPIOs.
    SYSTEMD_AUTO_ENABLE:pn-keypad-display = "disable"

    # Use U-Boot as RAUC's A/B boot chooser. The chosen rootfs is appended by
    # boot.cmd, so meta-raspberrypi must not bake a fixed root= into cmdline.txt.
    RPI_USE_U_BOOT = "1"
    CMDLINE_ROOTFS = ""

  rauc-ab-update: |
    # RAUC's service and the product health/mark-good unit are systemd units.
    INIT_MANAGER = "systemd"
    DISTRO_FEATURES:append = " rauc"
    WKS_FILE = "rpi4-ab.wks.in"
    IMAGE_FSTYPES = "ext4 wic.bz2 wic.bmap"
    IMAGE_ROOTFS_EXTRA_SPACE = "262144"

  development: |
    # Development convenience only; remove for production images.
    EXTRA_IMAGE_FEATURES += "debug-tweaks ssh-server-openssh"

  shared-cache: |
    # Keep downloads and sstate outside TMPDIR so clean builds can reuse them.
    DL_DIR = "${TOPDIR}/../downloads"
    SSTATE_DIR = "${TOPDIR}/../sstate-cache"
